<style>
:root{
  --navy:#0E2235;
  --navy-line: rgba(244,238,221,0.12);
  --parchment:#F4EEDD;
  --parchment-dim:#E7DFC8;
  --ink:#1C2B36;
  --ink-soft:#5B6B78;
  --aida:#E2703A;
  --meinschiff:#1C8C82;
  --gold:#D2A23D;
  --inactive:#4C6478;
  --line-hair: rgba(28,43,54,0.12);
  --radius:10px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'JetBrains Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;font-family:var(--font-body);background:var(--navy);color:var(--ink);}
.app{display:flex;flex-direction:column;height:100vh;}

.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:13px 24px;background:var(--navy);color:var(--parchment);
  border-bottom:1px solid var(--navy-line);flex-wrap:wrap;row-gap:8px;
}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);display:block;}
.topbar h1{font-family:var(--font-display);font-weight:600;font-size:19px;margin:2px 0 0;}
.topbar-stats{font-family:var(--font-mono);font-size:12px;color:var(--parchment-dim);display:flex;align-items:center;gap:12px;}
.ghost-btn{
  background:transparent;border:1px solid rgba(244,238,221,0.35);color:var(--parchment);
  font-family:var(--font-body);font-size:12px;padding:6px 13px;border-radius:999px;
  cursor:pointer;transition:background .15s;
}
.ghost-btn:hover{background:rgba(244,238,221,0.12);}
.ghost-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

.main{flex:1;display:flex;min-height:0;}

.sidebar{
  width:340px;flex-shrink:0;background:var(--parchment);
  display:flex;flex-direction:column;overflow-y:auto;
  border-right:1px solid rgba(0,0,0,0.08);
}
.sidebar-section{padding:16px 18px;}
.sidebar-section h2{
  font-family:var(--font-display);font-size:13px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink-soft);margin:0 0 10px;font-weight:600;
}
.info-section{border-top:1px solid var(--line-hair);flex:1;}

.route-group-label{
  font-family:var(--font-mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--ink-soft);margin:12px 0 4px;
}
.route-group-label:first-child{margin-top:0;}
.route-row{
  display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;
  cursor:pointer;transition:background .12s;
}
.route-row:hover{background:rgba(28,43,54,0.05);}
.route-row.active{background:rgba(210,162,61,0.22);}
.route-row input{accent-color:var(--gold);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.route-row input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.route-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.route-text{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
.route-text .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.route-text .meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}

.info-cards{display:flex;flex-direction:column;gap:10px;}
.hint{font-size:12.5px;color:var(--ink-soft);line-height:1.5;}
.info-card{
  background:#fff;border:1px solid var(--line-hair);border-radius:var(--radius);
  padding:10px 12px;position:relative;box-shadow:0 1px 2px rgba(0,0,0,0.05);
}
.info-card .close{
  position:absolute;top:5px;right:7px;border:none;background:none;
  color:var(--ink-soft);font-size:16px;cursor:pointer;line-height:1;padding:4px;
}
.info-card .close:hover{color:var(--ink);}
.info-card .close:focus-visible{outline:2px solid var(--gold);outline-offset:1px;}
.info-card h3{font-family:var(--font-display);font-size:14px;margin:0 0 3px;padding-right:18px;font-weight:600;}
.info-card .ship-line{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
.info-card .dates{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);margin-bottom:4px;}
.info-card .participants{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
.info-card .stats{display:flex;gap:14px;font-family:var(--font-mono);font-size:11.5px;border-top:1px dashed var(--line-hair);padding-top:6px;color:var(--ink-soft);}
.info-card .stats b{color:var(--ink);font-weight:600;}

.map-wrap{position:relative;flex:1;min-width:0;}
#map{position:absolute;inset:0;background:var(--navy);}
.leaflet-tooltip.port-tip{
  font-family:var(--font-body);font-size:11.5px;background:var(--ink);color:var(--parchment);
  border:none;box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
.leaflet-tooltip.port-tip:before{border-top-color:var(--ink);}

.legend{
  position:absolute;bottom:16px;left:16px;background:rgba(14,34,53,0.88);
  backdrop-filter:blur(4px);border:1px solid var(--navy-line);border-radius:10px;
  padding:10px 14px;color:var(--parchment-dim);font-family:var(--font-mono);
  font-size:11px;z-index:500;max-width:220px;
}
.legend-row{display:flex;align-items:center;gap:8px;margin:3px 0;}
.legend-row.muted{color:rgba(244,238,221,0.55);}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dash{width:14px;height:2px;background:var(--inactive);display:inline-block;flex-shrink:0;}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;}
}

@media (max-width:760px){
  .main{flex-direction:column;}
  .sidebar{width:100%;order:2;border-right:none;border-top:1px solid rgba(0,0,0,0.08);max-height:none;}
  .map-wrap{height:46vh;order:1;flex:none;}
  .topbar{padding:10px 14px;}
  .topbar h1{font-size:16px;}
  .legend{font-size:10px;padding:8px 11px;bottom:10px;left:10px;}
}
</style>
</head>

const PARTICIPANTS = {
  F4: "Monika, Stephan, Jule & Bennet",
  F3: "Monika, Stephan & Bennet",
  F2: "Monika & Stephan"
};
const REEDEREI_LABEL = { aida: "AIDA Cruises", meinschiff: "Mein Schiff (TUI Cruises)" };
const INACTIVE_COLOR = "#4C6478";

// Jede Reise bekommt ihre eigene, gleichmäßig über den Farbkreis verteilte Farbe
CRUISES.forEach((c, i) => {
  const hue = Math.round((i * 360) / CRUISES.length);
  c.color = `hsl(${hue}, 68%, 58%)`;
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------------------------------------------------------------------------
// Karte initialisieren
// ---------------------------------------------------------------------------
const map = L.map('map', {
  center: [48, 12],
  zoom: 3,
  minZoom: 2,
  maxZoom: 10,
  worldCopyJump: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap-Mitwirkende &copy; CARTO',
  maxZoom: 19
}).addTo(map);

// ---------------------------------------------------------------------------
// Kurvenberechnung (leichte Bézier-Wölbung zwischen zwei Häfen)
// ---------------------------------------------------------------------------
function curvePoints(p1, p2, segments, bend) {
  segments = segments || 24;
  bend = bend === undefined ? 0.15 : bend;
  const lat1 = p1[0], lon1 = p1[1], lat2 = p2[0], lon2 = p2[1];
  const mlat = (lat1 + lat2) / 2, mlon = (lon1 + lon2) / 2;
  const dLat = lat2 - lat1, dLon = lon2 - lon1;
  const perpLat = -dLon, perpLon = dLat;
  const norm = Math.sqrt(perpLat * perpLat + perpLon * perpLon) || 1;
  const offset = bend * norm;
  const ctrlLat = mlat + (perpLat / norm) * offset;
  const ctrlLon = mlon + (perpLon / norm) * offset;
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * ctrlLat + t * t * lat2;
    const lon = (1 - t) * (1 - t) * lon1 + 2 * (1 - t) * t * ctrlLon + t * t * lon2;
    pts.push([lat, lon]);
  }
  return pts;
}

// ---------------------------------------------------------------------------
// Routen-Layer pro Reise aufbauen
// ---------------------------------------------------------------------------
const routeLayers = {};
const selected = new Set();

CRUISES.forEach(cruise => {
  const lineGroup = L.layerGroup().addTo(map);
  const markerGroup = L.layerGroup();
  const allPts = [];

  for (let i = 0; i < cruise.stops.length - 1; i++) {
    const a = cruise.stops[i], b = cruise.stops[i + 1];
    const pts = curvePoints([a.lat, a.lon], [b.lat, b.lon]);
    pts.forEach(p => allPts.push(p));
    const line = L.polyline(pts, { color: INACTIVE_COLOR, weight: 1.6, opacity: 0.45 });
    line.on('click', () => toggleRoute(cruise.id));
    lineGroup.addLayer(line);
  }

  cruise.stops.forEach(s => {
    const marker = L.circleMarker([s.lat, s.lon], {
      radius: 5, color: cruise.color, weight: 1.5,
      fillColor: '#FFF8E7', fillOpacity: 0.95, opacity: 0.95
    });
    marker.bindTooltip(`<strong>${s.city}</strong><br>${s.date}`, { direction: 'top', offset: [0, -6], className: 'port-tip' });
    marker.on('click', () => toggleRoute(cruise.id));
    markerGroup.addLayer(marker);
  });

  routeLayers[cruise.id] = {
    lineGroup, markerGroup,
    bounds: L.latLngBounds(allPts)
  };
});

function setActiveStyle(cruise, active) {
  const layers = routeLayers[cruise.id];
  layers.lineGroup.eachLayer(line => {
    line.setStyle(active
      ? { color: cruise.color, weight: 3.4, opacity: 0.92 }
      : { color: INACTIVE_COLOR, weight: 1.6, opacity: 0.45 });
  });
  if (active) {
    layers.markerGroup.addTo(map);
  } else {
    map.removeLayer(layers.markerGroup);
  }
}

function toggleRoute(id) {
  const cruise = CRUISES.find(c => c.id === id);
  if (selected.has(id)) {
    selected.delete(id);
    setActiveStyle(cruise, false);
  } else {
    selected.add(id);
    setActiveStyle(cruise, true);
    map.flyToBounds(routeLayers[id].bounds, { padding: [60, 60], maxZoom: 6, duration: reduceMotion ? 0 : 0.6 });
  }
  syncRowState(id);
  renderInfoCards();
  updateCount();
}

function clearAll() {
  Array.from(selected).forEach(id => {
    const cruise = CRUISES.find(c => c.id === id);
    setActiveStyle(cruise, false);
    syncRowState(id);
  });
  selected.clear();
  renderInfoCards();
  updateCount();
}

// ---------------------------------------------------------------------------
// Sidebar: Reisenliste
// ---------------------------------------------------------------------------
const routeListEl = document.getElementById('routeList');

function buildRouteList() {
  const groups = [
    { key: 'aida', label: 'AIDA Cruises' },
    { key: 'meinschiff', label: 'Mein Schiff (TUI Cruises)' }
  ];
  let html = '';
  groups.forEach(g => {
    const items = CRUISES.filter(c => c.line === g.key);
    if (!items.length) return;
    html += `<div class="route-group-label">${g.label}</div>`;
    items.forEach(c => {
      const year = c.start.split('.')[2];
      html += `
        <label class="route-row" data-id="${c.id}">
          <input type="checkbox" data-id="${c.id}" />
          <span class="route-dot" style="background:${c.color}"></span>
          <span class="route-text">
            <span class="name">${c.name}</span>
            <span class="meta">${c.ship} · ${year}</span>
          </span>
        </label>`;
    });
  });
  routeListEl.innerHTML = html;

  routeListEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => toggleRoute(parseInt(cb.dataset.id, 10)));
  });
}

function syncRowState(id) {
  const row = routeListEl.querySelector(`.route-row[data-id="${id}"]`);
  const cb = routeListEl.querySelector(`input[data-id="${id}"]`);
  if (!row || !cb) return;
  const isActive = selected.has(id);
  cb.checked = isActive;
  row.classList.toggle('active', isActive);
}

function updateCount() {
  document.getElementById('selectedCount').textContent = selected.size;
}

// ---------------------------------------------------------------------------
// Sidebar: Info-Karten der ausgewählten Reisen
// ---------------------------------------------------------------------------
const infoCardsEl = document.getElementById('infoCards');

function renderInfoCards() {
  if (selected.size === 0) {
    infoCardsEl.innerHTML = '<p class="hint">Noch keine Reise ausgewählt. Klicke links in der Liste oder direkt auf eine Route in der Karte.</p>';
    return;
  }
  const ids = Array.from(selected).sort((a, b) => a - b);
  infoCardsEl.innerHTML = ids.map(id => {
    const c = CRUISES.find(cr => cr.id === id);
    return `
      <div class="info-card">
        <button class="close" type="button" data-id="${c.id}" aria-label="Reise abwählen">×</button>
        <h3>${c.name}</h3>
        <div class="ship-line"><span class="route-dot" style="background:${c.color}"></span>${c.ship} · ${REEDEREI_LABEL[c.line]}</div>
        <div class="dates">${c.start} – ${c.end}</div>
        <div class="participants">${PARTICIPANTS[c.code]}</div>
        <div class="stats"><span><b>${c.etappen}</b> Etappen</span><span><b>${c.sm.toLocaleString('de-DE')}</b> sm</span></div>
      </div>`;
  }).join('');

  infoCardsEl.querySelectorAll('.close').forEach(btn => {
    btn.addEventListener('click', () => toggleRoute(parseInt(btn.dataset.id, 10)));
  });
}

document.getElementById('clearBtn').addEventListener('click', clearAll);

buildRouteList();
renderInfoCards();
updateCount();

// Größenanpassung (mobile Leaflet-Fix)
// ---------------------------------------------------------------------------
function fixMapSize() { map.invalidateSize(); }
window.addEventListener('resize', () => {
  setTimeout(fixMapSize, 50);
  setTimeout(fixMapSize, 300);
});
setTimeout(fixMapSize, 100);
setTimeout(fixMapSize, 500);
</script>
